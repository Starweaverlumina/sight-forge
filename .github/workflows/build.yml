name: Build

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore application
        run: dotnet restore src/SightForge/SightForge.csproj

      - name: Restore tests
        run: dotnet restore tests/SightForge.Tests/SightForge.Tests.csproj

      - name: Build application
        run: dotnet build src/SightForge/SightForge.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/SightForge.Tests/SightForge.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Publish framework-dependent Windows build
        run: dotnet publish src/SightForge/SightForge.csproj --configuration Release --no-restore --output artifacts/SightForge

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SightForge-windows
          path: artifacts/SightForge
          if-no-files-found: error
