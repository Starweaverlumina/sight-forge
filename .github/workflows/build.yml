name: Build

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/SightForge/SightForge.csproj

      - name: Build
        run: dotnet build src/SightForge/SightForge.csproj --configuration Release --no-restore

      - name: Publish portable Windows build
        run: dotnet publish src/SightForge/SightForge.csproj --configuration Release --no-build --runtime win-x64 --self-contained false --output artifacts/SightForge-win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SightForge-win-x64
          path: artifacts/SightForge-win-x64
          if-no-files-found: error
